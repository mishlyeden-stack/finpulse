name: update-numbers
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: numbers
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/update-numbers.mjs
      - name: commit if changed
        run: |
          git config user.name "FinPulse bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/numbers.json
          git diff --cached --quiet || (git commit -m "numbers $(date -u +%F\ %H:%M)" && git pull --rebase -X theirs -q && git push -q)
