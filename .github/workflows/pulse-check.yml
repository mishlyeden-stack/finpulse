name: pulse-check
# One-time diagnostic (manual only, read-only): do the Pulse data sources answer from GitHub's runners?
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/pulse.mjs --out /tmp/pulse-cloud.json --force
      - run: |
          node -e "const p=require('/tmp/pulse-cloud.json');console.log('indicators',Object.keys(p.indicators).length,'errors',JSON.stringify(p.errors));for(const k of ['boi_rate','cpi_yoy','fed_rate','ust_10y','us_cpi_yoy','broad_dollar','ecb_rate','usd_ils','unemployment']){const i=p.indicators[k];console.log(k,i?i.latest.t+' '+i.latest.v:'MISSING')}"
